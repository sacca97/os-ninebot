name: Android release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version), 'Expected x.y.z tag'
          source = Path('android/app/build.gradle.kts').read_text()
          assert re.search(r'versionName = "([^"\n]+)"', source)[1] == version, 'Tag and app version differ'
          PY
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: openride-release
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" || {
            echo 'Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_PASSWORD secrets.'
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          keytool -certreq -keystore android/release.jks -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -file "$RUNNER_TEMP/openride-signing-check.csr"
          rm -f "$RUNNER_TEMP/openride-signing-check.csr"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - name: Build and check
        working-directory: android
        run: |
          ./gradlew --no-daemon --build-cache :core:test :app:lintRelease :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "openride-$GITHUB_REF_NAME.apk"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "android/openride-$GITHUB_REF_NAME.apk" \
            --verify-tag --title "OpenRide $GITHUB_REF_NAME" --generate-notes
      - name: Remove signing files
        if: always()
        run: rm -f android/release.jks android/keystore.properties
